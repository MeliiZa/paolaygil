<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="" />
  <link rel="icon" type="image/x-icon" href="img/favicon-96.png">
  <title>25 Aniversario Paola Denisse y Gilberto</title>

  <script src="https://kit.fontawesome.com/4a811f41e5.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
  <link href="./style.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Great+Vibes&family=Petit+Formal+Script&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- ========================= -->
<!-- HERO -->
<!-- ========================= -->
<div class="masthead text-center bg-image rounded-3" style="background-image: url('./img/ramo.jpg'); height: 600px;">
  <div class="color-overlay d-flex align-items-center justify-content-center" style="background-color: rgba(0,0,0,0.6);">
    <div class="container text-white">
      <h1 class="h1title mb-3 pt-3">Paola Denisse<br>Y<br>Gilberto</h1>
      <h2 class="mb-2">25 Aniversario</h2>

      <div class="section container justify-content-center">
        <h4 class="front" id="hero-title">Cargando...</h4>
        <p id="hero-details"></p>
      </div>

      <a href="#rsvp-section" class="button">Confirma tu asistencia</a>
    </div>
  </div>
</div>

<!-- ========================= -->
<!-- SLOGAN -->
<!-- ========================= -->
<div class="container d-flex align-items-center justify-content-center slogan" style="height: 200px;">
  <div class="text-center">
    <h1>25 años unidos por el amor</h1>
    <p>celebrando una vida juntos</p>
  </div>
</div>

<!-- ========================= -->
<!-- DETAILS -->
<!-- ========================= -->
<div class="masthead sky text-center bg-image rounded-3" style="background-image: url('./img/sky.jpg'); height: 600px;">
  <div class="color-overlay d-flex align-items-center justify-content-center" style="background-color: rgba(0,0,0,0.6);">
    <div class="container">
      <div class="row pt-5">
        <div class="col-md-4 detalles-text">
          <i class="fa-solid fa-calendar icono"></i>
          <p class="text-detail">18 de abril</p>
        </div>
        <div class="col-md-4 detalles-text">
          <i class="fa-solid fa-church icono"></i>
          <p class="text-detail">Ceremonia 4:00pm</p>
        </div>
        <div class="col-md-4 detalles-text">
          <i class="fa-solid fa-champagne-glasses icono"></i>
          <p class="text-detail">Recepción 6:30pm</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ========================= -->
<!-- RSVP SECTION -->
<!-- ========================= -->
<div class="section card container d-flex justify-content-center" id="rsvp-section">
  <h2 id="rsvp-title">Cargando...</h2>
  <p id="rsvp-details"></p>

  <form class="mx-auto" id="rsvp-form" style="display:none; margin-top:20px;">
    <p id="existing-note" class="muted"></p>

    <label>
      ¿Cuántas personas asistirán?
      <br/>
      <select id="attending"></select>
    </label>

    <div id="guest-names" style="margin-top:16px;"></div>

    <div class="button-box d-flex justify-content-center">
      <button type="submit">Confirmar asistencia</button>
    </div>
  </form>

  <p id="status" style="margin-top:16px;"></p>
</div>

<!-- ========================= -->
<!-- JS -->
<!-- ========================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const db = supabase.createClient(
    "https://javcvjdvnpmzoskqnxlk.supabase.co",
    "sb_publishable_p_6Pj2HRuUfJxcWBG8nU5A_9soVjn0s"
  );

  const params = new URLSearchParams(window.location.search);
  const inviteCode = params.get("code");

  const heroTitleEl = document.getElementById("hero-title");
  const heroDetailsEl = document.getElementById("hero-details");
  const rsvpTitleEl = document.getElementById("rsvp-title");
  const rsvpDetailsEl = document.getElementById("rsvp-details");

  const formEl = document.getElementById("rsvp-form");
  const selectEl = document.getElementById("attending");
  const statusEl = document.getElementById("status");
  const guestNamesEl = document.getElementById("guest-names");
  const existingNoteEl = document.getElementById("existing-note");

  let currentInvite = null;

  if (!inviteCode) {
    const msg = "Bienvenid@! Usa tu enlace personal para confirmar tu asistencia.";
    heroTitleEl.textContent = msg;
    rsvpTitleEl.textContent = msg;
  } else {
    loadInvite();
  }

  function renderGuestNameInputs(count, existingNames = []) {
    guestNamesEl.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = `Invitado ${i + 1}`;
      input.value = existingNames[i] || "";
      guestNamesEl.appendChild(input);
    }
  }

  async function loadInvite() {
    const { data: invite } = await db
      .from("invites")
      .select("*")
      .eq("invite_code", inviteCode)
      .single();

    if (!invite) {
      heroTitleEl.textContent = "Invitación no encontrada";
      rsvpTitleEl.textContent = "Invitación no encontrada";
      return;
    }

    currentInvite = invite;

    heroTitleEl.textContent = `Bienvenid@s, ${invite.display_name}`;
    rsvpTitleEl.textContent = `Bienvenid@s, ${invite.display_name}`;

    heroDetailsEl.textContent = `Incluye hasta ${invite.max_guests} invitados`;
    rsvpDetailsEl.textContent = `Incluye hasta ${invite.max_guests} invitados`;

    selectEl.innerHTML = "";
    for (let i = 0; i <= invite.max_guests; i++) {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = i;
      selectEl.appendChild(opt);
    }

    const { data: existingRsvp } = await db
      .from("rsvps")
      .select("*")
      .eq("invite_id", invite.id)
      .single();

    if (existingRsvp) {
      selectEl.value = existingRsvp.attending;
      renderGuestNameInputs(existingRsvp.attending, existingRsvp.guest_names || []);
      existingNoteEl.textContent = "Ya confirmaste. Puedes actualizar los nombres si lo deseas.";
    }

    formEl.style.display = "block";
  }

  selectEl.addEventListener("change", () => {
    renderGuestNameInputs(Number(selectEl.value));
  });

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();

    const attending = Number(selectEl.value);
    const guestNames = [...guestNamesEl.querySelectorAll("input")].map(i => i.value);

    statusEl.textContent = "Guardando...";

    const { error } = await db.from("rsvps").upsert({
      invite_id: currentInvite.id,
      attending,
      guest_names: guestNames
    }, { onConflict: "invite_id" });

    statusEl.textContent = error
      ? "Error al guardar 😢"
      : "Asistencia confirmada 🎉";
  });
</script>

</body>
</html>
